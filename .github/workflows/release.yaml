name: Release

on:
  workflow_dispatch:
    inputs:
      preid:
        description: "Prerelease id to turn the conventional-commit bump into a prerelease (beta, alpha, rc, next). Empty = stable."
        required: false
        default: ""
      projects:
        description: "Comma-separated projects to scope to (e.g. @storyblok/field-plugin,@storyblok/field-plugin-cli). Empty = all."
        required: false
        default: ""
      first_release:
        description: "Bootstrap first release on this branch (no previous tag). Use once per package/branch."
        type: boolean
        required: false
        default: false

env:
  HUSKY: 0
  NX_REJECT_UNKNOWN_LOCAL_CACHE: 0

jobs:
  # Enforce the branch/channel invariant before anything versions or pushes:
  # main releases stable (npm latest) only; prereleases run on their channel
  # branch (beta/alpha/next/rc). This keeps a prerelease from landing on main
  # even though the release App token can bypass the protect-main ruleset.
  guard:
    name: Validate channel
    runs-on: ubuntu-slim
    timeout-minutes: 2
    steps:
      - name: Enforce stable-only on main, prerelease-only off main
        env:
          REF: ${{ github.ref_name }}
          PREID: ${{ inputs.preid }}
        run: |
          if [ "$REF" = "main" ] && [ -n "$PREID" ]; then
            echo "::error::preid='$PREID' is not allowed on main — main releases stable (latest) only."
            exit 1
          fi
          if [ "$REF" != "main" ] && [ -z "$PREID" ]; then
            echo "::error::A stable release (empty preid) must run on main, not '$REF'."
            exit 1
          fi
          echo "OK: ref='$REF' preid='${PREID:-<stable>}'"

  dry-run:
    name: Dry Run
    runs-on: ubuntu-latest
    needs: guard
    environment: test
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: tree:0
          fetch-tags: true
          persist-credentials: false

      - uses: ./.github/actions/setup-node

      - name: Run tests, linting and building
        run: pnpm nx run-many --target=test --parallel=3 -p="tag:npm:public"

      - name: Dry run
        env:
          GH_TOKEN: ${{ github.token }}
        run: pnpm nx release ${{ inputs.preid && format('--preid {0}', inputs.preid) || '' }} ${{ inputs.projects && format('--projects={0}', inputs.projects) || '' }} ${{ inputs.first_release && '--first-release' || '' }} --dry-run --verbose

      - name: Print Environment Info
        run: pnpm nx report

  # Production release requires human approval
  release:
    name: Release (Production)
    needs: [guard, dry-run]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write # Required for creating tags and commits
      pull-requests: write # Required for GitHub releases
    timeout-minutes: 20
    steps:
      # App token is a bypass actor on the protect-main ruleset, so nx release
      # can push the version commit and tags to the protected default branch.
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: tree:0
          fetch-tags: true
          token: ${{ steps.app-token.outputs.token }}
          # The only checkout in the repo that must keep its credentials:
          # `nx release` pushes the version commit and tags, because
          # `changelog.projectChangelogs.createRelease: "github"` in nx.json
          # forces nx's `git.push` default to true.
          persist-credentials: true

      - uses: ./.github/actions/setup-node

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Build all packages
        run: pnpm nx run-many --target=build --parallel=3 -p="tag:npm:public"

      - name: Version and create release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: pnpm nx release ${{ inputs.preid && format('--preid {0}', inputs.preid) || '' }} ${{ inputs.projects && format('--projects={0}', inputs.projects) || '' }} ${{ inputs.first_release && '--first-release' || '' }} --skip-publish --verbose
