name: Release

on:
  workflow_dispatch:
    inputs:
      preid:
        description: "Prerelease id to turn the conventional-commit bump into a prerelease (beta, alpha, rc, next). Empty = stable."
        required: false
        default: ""
      projects:
        description: "Comma-separated projects to scope to (e.g. @storyblok/field-plugin,@storyblok/field-plugin-cli). Empty = all."
        required: false
        default: ""

env:
  HUSKY: 0
  NX_REJECT_UNKNOWN_LOCAL_CACHE: 0

jobs:
  dry-run:
    name: Dry Run
    runs-on: ubuntu-latest
    environment: test
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: tree:0
          fetch-tags: true

      - uses: ./.github/actions/setup-node

      - name: Run tests, linting and building
        run: pnpm nx run-many --target=test --parallel=3 -p="tag:npm:public"

      - name: Dry run
        run: pnpm nx release ${{ inputs.preid && format('--preid {0}', inputs.preid) || '' }} ${{ inputs.projects && format('--projects={0}', inputs.projects) || '' }} --dry-run --verbose

      - name: Print Environment Info
        run: pnpm nx report

  # Production release requires human approval
  release:
    name: Release (Production)
    needs: dry-run
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write # Required for creating tags and commits
      pull-requests: write # Required for GitHub releases
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: tree:0
          fetch-tags: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: ./.github/actions/setup-node

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Build all packages
        run: pnpm nx run-many --target=build --parallel=3 -p="tag:npm:public"

      - name: Version and create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm nx release ${{ inputs.preid && format('--preid {0}', inputs.preid) || '' }} ${{ inputs.projects && format('--projects={0}', inputs.projects) || '' }} --skip-publish --verbose
