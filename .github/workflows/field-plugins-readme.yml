name: Field Plugins README

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/field-plugins/**"
      - ".github/workflows/field-plugins-readme.yml"

jobs:
  readme:
    runs-on: ubuntu-slim
    # The root packageManager is pnpm; let Yarn run in the field plugins until they move into the workspace.
    env:
      COREPACK_ENABLE_STRICT: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: corepack enable
      - run: corepack prepare yarn@3.6.3 --activate
      - name: Setup node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: "yarn"
          cache-dependency-path: apps/field-plugins/yarn.lock

      - name: Install dependencies
        run: yarn install --immutable
        working-directory: apps/field-plugins

      - name: Generate README
        run: yarn docs
        working-directory: apps/field-plugins

      - name: Check README is up to date
        run: git diff --exit-code README.md
        working-directory: apps/field-plugins
