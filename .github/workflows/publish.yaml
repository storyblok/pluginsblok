name: Publish

on:
  workflow_dispatch:
    inputs:
      projects:
        description: "Comma-separated projects to publish (e.g. @storyblok/field-plugin,@storyblok/field-plugin-cli). Empty = all publishable."
        required: false
        default: ""

jobs:
  test:
    name: Publish
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write # OIDC trusted publishing to npm + provenance
    timeout-minutes: 10
    env:
      npm_config_use_node_version: "24.18.0"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: tree:0
          persist-credentials: false

      - uses: ./.github/actions/setup-node

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.18.0"

      - name: Build publishable packages
        run: pnpm nx run-many -p="tag:npm:public" -t=build

      - name: Print Environment Info
        run: pnpm nx report
        shell: bash

      - name: Determine npm tag
        id: npm-tag
        run: |
          BRANCH_NAME=${GITHUB_REF#refs/heads/}
          if [ "$BRANCH_NAME" = "main" ]; then
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$BRANCH_NAME" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish packages
        run: pnpm nx release publish ${{ inputs.projects && format('--projects={0}', inputs.projects) || '' }} --excludeTaskDependencies --tag=${{ steps.npm-tag.outputs.tag }}
        shell: bash
