name: Space & Tool Plugins CI

on:
  push:
    branches: [main]
    paths:
      - "apps/space-tool-plugins/**"
      - ".github/workflows/ci-space-tool-templates.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/space-tool-plugins/**"
      - ".github/workflows/ci-space-tool-templates.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        plugin:
          - apps/space-tool-plugins/space-plugins/nuxt-starter/
          - apps/space-tool-plugins/space-plugins/nextjs-starter/
          - apps/space-tool-plugins/space-plugins/nuxt-base/
          - apps/space-tool-plugins/space-plugins/nuxt-story-starter/
          - apps/space-tool-plugins/tool-plugins/nuxt-starter/
          - apps/space-tool-plugins/tool-plugins/nextjs-starter/
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - run: corepack prepare yarn@3.6.3 --activate
      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: "yarn"
          cache-dependency-path: ${{ matrix.plugin }}yarn.lock

      - name: Install dependencies
        run: yarn install --immutable
        working-directory: ${{ matrix.plugin }}

      - name: Lint if script exists
        run: |
          if jq -e '.scripts.lint' package.json > /dev/null; then
            yarn lint
          else
            echo "No lint script found, skipping."
          fi
        working-directory: ${{ matrix.plugin }}

      - name: Build starter
        run: yarn build
        working-directory: ${{ matrix.plugin }}
