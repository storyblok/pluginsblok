# Field-plugin-specific CI. Covers what ci.yaml's `tag:npm:public` selection
# can't: the subtree's shared-config lint, private starter-template builds,
# and the CLI scaffolding smoke test.
name: Field Plugin CI

on:
  push:
    branches: [main]
    paths:
      - "packages/field-plugin/**"
  pull_request:
    branches: [main]
    paths:
      - "packages/field-plugin/**"

env:
  NX_REJECT_UNKNOWN_LOCAL_CACHE: 0

jobs:
  check:
    name: Lint & build templates
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node

      # The field-plugin subtree shares a single eslint config on its (private)
      # root package, so it isn't covered by the npm:public selection in ci.yaml.
      # Lint the whole subtree as a unit here.
      - name: Lint
        run: pnpm nx run field-plugin:lint

      # Prettier is disabled as an eslint rule here (eslint-config-prettier), so
      # the lint step above doesn't check formatting. Restore the library format
      # check the old repo had (lib scope only — matches the old ci-library.yml).
      - name: Check formatting
        run: pnpm nx run field-plugin:format:check

      # Starter templates are private, so they're also skipped by ci.yaml.
      # Build them to catch breakage from library/CLI changes (the glob skips
      # the non-buildable monorepo template automatically). test:types is added
      # because the subtree lint doesn't type-check, and only the js template
      # exposes it (nx skips the templates that don't).
      - name: Build & type-check starter templates
        run: pnpm nx run-many --target=build,test:types --parallel=3 -p="field-plugin-*-template"

      # manifest-helper is a build input to the library but is private, so its
      # vitest suite isn't covered by ci.yaml's npm:public test run. Run it here.
      - name: Test manifest-helper
        run: pnpm nx run @storyblok/manifest-helper:test

  cli-smoke:
    name: CLI smoke test (${{ matrix.structure }}/${{ matrix.template }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        template: [js, react, vue2, vue3]
        structure: [standalone, monorepo]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node

      # Build the CLI so dist/templates carries the copied templates with the
      # library version pinned (fix-workspace-versions) — i.e. what users get.
      - name: Build the CLI
        run: pnpm nx run @storyblok/field-plugin-cli:build

      # Scaffold a plugin from the built CLI exactly as a user would. The command
      # is the same for both structures: --repoName is only consumed by the
      # monorepo path and is harmlessly ignored for standalone. The scaffolded
      # repo runs git init/commit, so give it an identity.
      - name: Scaffold ${{ matrix.structure }} ${{ matrix.template }} plugin
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          node packages/field-plugin/packages/cli/bin.js create \
            --dir "$RUNNER_TEMP" \
            --template ${{ matrix.template }} \
            --structure ${{ matrix.structure }} \
            --packageManager npm \
            --repoName smoke-repo \
            --pluginName smoke-plugin

      # Install published deps and build, proving the scaffolded project is valid
      # (the CLI + template + version-pinning end-to-end path). Standalone builds
      # the plugin folder directly; monorepo installs at the workspace root
      # (smoke-repo) and builds the plugin through its npm workspace.
      - name: Install & build scaffolded plugin
        run: |
          if [ "${{ matrix.structure }}" = "monorepo" ]; then
            cd "$RUNNER_TEMP/smoke-repo"
            npm install
            npm run build --workspace=smoke-plugin
          else
            cd "$RUNNER_TEMP/smoke-plugin"
            npm install
            npm run build
          fi
