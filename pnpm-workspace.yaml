packages:
  # plugin core libraries, SDK and CLI
  - packages/*
  - packages/field-plugin/packages/*
  - packages/field-plugin/packages/cli/templates/*
  - packages/field-plugin/packages/lib-helpers/*
  # plugin monorepo internal tools
  - tools/*
allowBuilds:
  '@parcel/watcher': true
  core-js: true
  esbuild: true
  nx: true
overrides:
  # @microsoft/api-extractor asks for lodash ~4.17.15, which caps at 4.17.x.
  # vite-plugin-dts 4.2.1 pins it to 7.47.7. Remove this once vite-plugin-dts
  # and @microsoft/api-extractor (>= 7.59, no lodash dependency) are bumped.
  'lodash@~4.17.15': ^4.18.1
